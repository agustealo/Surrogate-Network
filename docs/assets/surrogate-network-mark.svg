  <path d="M72 72 C112 40 168 54 181 91 C193 125 163 142 128 145 C95 148 69 160 76 190 C83 219 132 225 172 198" fill="none" stroke="url(#sn-gradient)" stroke-width="20" stroke-linecap="round" filter="url(#shadow)"/>
