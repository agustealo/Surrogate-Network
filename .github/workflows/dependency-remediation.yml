name: One-shot dependency remediation

on:
  push:
    branches:
      - test/fyp-persisted-preference-journey-20261021
    paths:
      - .github/workflows/dependency-remediation.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Apply patched production package versions and regenerate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.3 zod@4.6.7
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint-config-next@16.4.3
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit manifest and generated lockfile to this PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix(deps): patch Next.js and Zod with npm-generated lockfile'
          git push origin HEAD:test/fyp-persisted-preference-journey-20261021
