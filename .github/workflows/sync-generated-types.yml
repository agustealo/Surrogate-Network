name: Sync generated database types once

on:
  push:
    branches:
      - hardening/retire-dormant-media-20260923

permissions:
  contents: write
  actions: read

jobs:
  sync:
    if: github.event.head_commit.message == 'chore: bootstrap exact generated database types'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: hardening/retire-dormant-media-20260923
          fetch-depth: 0

      - name: Download proven generated type artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/generated-db-types
          mkdir -p /tmp/generated-db-types
          gh run download 35937866686 \
            --repo "${{ github.repository }}" \
            --name generated-database-types \
            --dir /tmp/generated-db-types
          test -s /tmp/generated-db-types/generated-database.types.ts
          cp /tmp/generated-db-types/generated-database.types.ts src/infrastructure/supabase/database.types.ts
          ! grep -q 'media_assets:' src/infrastructure/supabase/database.types.ts
          ! grep -q 'media_access_requests:' src/infrastructure/supabase/database.types.ts
          ! grep -q 'media_access_grants:' src/infrastructure/supabase/database.types.ts

      - name: Remove one-shot bootstrap and commit exact artifact
        run: |
          rm .github/workflows/sync-generated-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/supabase/database.types.ts .github/workflows/sync-generated-types.yml
          git diff --cached --quiet && { echo 'No generated type change found'; exit 1; }
          git commit -m "chore: sync canonical database types after media retirement"
          git push origin HEAD:hardening/retire-dormant-media-20260923
