name: Temporary dependency lockfile repair

on:
  push:
    branches: [ux/consumer-entry-accessibility-20261018]
    paths:
      - '.github/workflows/temporary-lockfile-repair.yml'

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: github.repository == 'agustealo/Surrogate-Network'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate vulnerable dependency resolutions using npm registry
        run: |
          npm audit fix --package-lock-only || echo 'Some advisories cannot be auto-fixed; production audit remains mandatory.'
      - name: Verify locked dependencies install and pass production audit
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Commit reproducible lockfile to this branch only
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          git commit -m "fix(deps): resolve patched production dependencies"
          git push origin HEAD:refs/heads/ux/consumer-entry-accessibility-20261018
