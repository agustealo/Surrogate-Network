name: Promote exact runtime screenshots

on:
  push:
    branches:
      - docs/real-runtime-screenshot-tour
    paths:
      - .github/workflows/promote-runtime-screenshots.yml

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out screenshot branch
        uses: actions/checkout@v5
        with:
          ref: docs/real-runtime-screenshot-tour
          fetch-depth: 0

      - name: Download exact green consumer visual evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/consumer-visual-evidence
          mkdir -p /tmp/consumer-visual-evidence
          gh run download 36179582230 \
            --repo "${GITHUB_REPOSITORY}" \
            --name consumer-visual-evidence \
            --dir /tmp/consumer-visual-evidence

          expected=(
            01-public-home.png
            02-published-need.png
            03-incoming-proposal.png
            04-completed-exchange.png
            05-how-it-works.png
            06-safety.png
            07-member-dashboard.png
            08-discovery-marketplace.png
            09-published-offer.png
            10-proposal-composer.png
            11-member-profile-safety.png
            12-active-surrogacy.png
            13-account-privacy-controls.png
            14-admin-console.png
            15-moderation-reports.png
            16-community-principles.png
          )

          mkdir -p docs/screenshots
          for shot in "${expected[@]}"; do
            test -s "/tmp/consumer-visual-evidence/${shot}"
            cp "/tmp/consumer-visual-evidence/${shot}" "docs/screenshots/${shot}"
          done

          rm -f docs/screenshots/*.webp

      - name: Commit exact runtime frames
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi
          git commit -m "docs: promote exact runtime screenshots from CI #357"
          git push origin HEAD:docs/real-runtime-screenshot-tour
