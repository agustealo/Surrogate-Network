name: Controlled Supabase Migration

# Explicit, manually approved operation only. Never runs on push or PR.
on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: 'Exact reviewed master commit (40 hexadecimal characters)'
        required: true
        type: string
      project_ref:
        description: 'Dedicated Surrogate Network Supabase ref'
        required: true
        type: string
      apply:
        description: 'Apply migrations after a successful dry run (false = inspection only)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: surrogate-controlled-supabase-migration
  cancel-in-progress: false

jobs:
  remote-migrations:
    name: CONTROLLED REMOTE MIGRATIONS
    runs-on: ubuntu-latest
    environment: controlled-trial
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Verify exact revision and protected master
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          TARGET_REF: ${{ inputs.project_ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected revision must be a full SHA'; exit 1; }
          [[ "$GITHUB_SHA" == "$EXPECTED_REVISION" ]] || { echo 'Workflow revision differs from reviewed revision'; exit 1; }
          [[ "$TARGET_REF" == "ylutogygxpbpqgfnovpe" ]] || { echo 'Refusing a different Supabase project'; exit 1; }
          protected="$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq '.protected')"
          [[ "$protected" == "true" ]] || { echo 'master is not protected; refusing privileged migration'; exit 1; }
          rules="$(gh api "repos/$GITHUB_REPOSITORY/rulesets" --jq '[.[] | select(.enforcement == "active")] | length')"
          [[ "$rules" =~ ^[0-9]+$ ]] && (( rules > 0 )) || { echo 'No active repository ruleset'; exit 1; }

      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Validate canonical migration inventory
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | LC_ALL=C sort)
          [[ "${#migrations[@]}" -eq 31 ]] || { echo "Expected 31 migrations, found ${#migrations[@]}"; exit 1; }
          previous=''
          for filename in "${migrations[@]}"; do
            [[ "$filename" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]] || { echo "Invalid filename: $filename"; exit 1; }
            version="${filename%%_*}"
            [[ "$version" != "$previous" ]] || { echo "Duplicate version: $version"; exit 1; }
            previous="$version"
          done
          echo 'Canonical migration files: 31, ordered and uniquely versioned.'

      - name: Install pinned Supabase CLI
        run: npm install -g supabase@2.117.0

      - name: Link isolated target and inspect pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          TARGET_REF: ${{ inputs.project_ref }}
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_DB_PASSWORD" ]] || { echo 'Required operator secrets are unavailable'; exit 1; }
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          supabase link --project-ref "$TARGET_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked
          supabase db push --linked --dry-run

      - name: Apply canonical migration history
        if: inputs.apply == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase db push --linked --yes
          supabase migration list --linked > remote-migrations.txt
          while IFS= read -r file; do
            version="${file%%_*}"
            grep -Fq "$version" remote-migrations.txt || { echo "Missing remote migration version: $version"; exit 1; }
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | LC_ALL=C sort)
          echo 'All 31 original repository migration versions appear in remote history.'
