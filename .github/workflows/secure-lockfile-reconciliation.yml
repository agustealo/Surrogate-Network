name: Temporary secure lockfile reconciliation
on:
  push:
    branches:
      - fix/secure-lockfile-reconciliation-20261031
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'agustealo/Surrogate-Network'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Generate lockfile using the npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Prove clean installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect security audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Commit generated lockfile and remove bootstrap workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/secure-lockfile-reconciliation.yml
          git add package-lock.json
          git diff --cached --exit-code && { echo 'No lockfile changes'; exit 1; } || test "$?" -eq 1
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): reconcile patched manifest with registry-generated lockfile'
          git push origin HEAD:fix/secure-lockfile-reconciliation-20261031
