name: Surrogate Companion CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  NODE_VERSION: '22'

jobs:
  install:
    name: INSTALL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

  typecheck:
    name: TYPECHECK
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore node modules from cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  lint:
    name: LINT
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore node modules from cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test-unit:
    name: UNIT
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore node modules from cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --passWithNoTests
        env:
          CI: true

  test-component:
    name: COMPONENT
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore node modules from cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run component tests
        run: npm run test:component -- --passWithNoTests
        env:
          CI: true

  test-security:
    name: SECURITY
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore node modules from cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Start Supabase
        run: |
          supabase start
          sleep 15
        env:
          SUPABASE_SERVICE_ROLE_KEY: local-service-role-key

      - name: Apply migrations
        run: supabase db reset --no-seed
        continue-on-error: true

      - name: Run security regression tests
        run: npm run test:security
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-anon-key
          SUPABASE_SERVICE_ROLE_KEY: local-service-role-key

  test-navigation:
    name: NAVIGATION
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore node modules from cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run navigation and shell ownership tests
        run: npm run test:navigation
        env:
          CI: true

  build:
    name: BUILD
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test-unit, test-component, test-security, test-navigation]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore node modules from cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local
        run: |
          echo "NEXT_PUBLIC_DEMO_MODE=true" > .env.local
          echo "NEXT_PUBLIC_APP_URL=https://surrogate-companion.com" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=demo-anon-key" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=demo-service-role-key" >> .env.local

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next
          retention-days: 7

  test-e2e:
    name: E2E SMOKE
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore node modules from cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local
        run: |
          echo "NEXT_PUBLIC_DEMO_MODE=true" > .env.local
          echo "NEXT_PUBLIC_APP_URL=https://surrogate-companion.com" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=demo-anon-key" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=demo-service-role-key" >> .env.local

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .next

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E smoke tests
        run: npm run test:e2e:smoke
        env:
          CI: true

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: playwright-report/
          retention-days: 7

  accessibility:
    name: A11Y
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore node modules from cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local
        run: |
          echo "NEXT_PUBLIC_DEMO_MODE=true" > .env.local
          echo "NEXT_PUBLIC_APP_URL=https://surrogate-companion.com" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=demo-anon-key" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=demo-service-role-key" >> .env.local

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .next

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run accessibility audit
        run: npm run test:a11y
        env:
          CI: true

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 7

  quality-gate:
    name: QUALITY GATE
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test-unit, test-component, test-security, test-navigation, build, test-e2e, accessibility]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "Type check failed"
            exit 1
          fi

          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint failed"
            exit 1
          fi

          if [ "${{ needs.test-unit.result }}" != "success" ]; then
            echo "Unit tests failed"
            exit 1
          fi

          if [ "${{ needs.test-component.result }}" != "success" ]; then
            echo "Component tests failed"
            exit 1
          fi

          if [ "${{ needs.test-security.result }}" != "success" ]; then
            echo "Security tests failed"
            exit 1
          fi

          if [ "${{ needs.test-navigation.result }}" != "success" ]; then
            echo "Navigation tests failed"
            exit 1
          fi

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build failed"
            exit 1
          fi

          if [ "${{ needs.test-e2e.result }}" != "success" ]; then
            echo "E2E tests failed"
            exit 1
          fi

          if [ "${{ needs.accessibility.result }}" != "success" ]; then
            echo "Accessibility tests failed"
            exit 1
          fi

          echo "All quality gates passed."

      - name: Quality Gate Summary
        if: success()
        run: |
          echo "Type check: ${{ needs.typecheck.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Unit tests: ${{ needs.test-unit.result }}"
          echo "Component tests: ${{ needs.test-component.result }}"
          echo "Security tests: ${{ needs.test-security.result }}"
          echo "Navigation tests: ${{ needs.test-navigation.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "E2E tests: ${{ needs.test-e2e.result }}"
          echo "Accessibility: ${{ needs.accessibility.result }}"
