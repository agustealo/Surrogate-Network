name: Surrogate Companion CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  NODE_VERSION: '22'

jobs:
  install:
    name: INSTALL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci

  dependency-audit:
    name: DEPENDENCY AUDIT
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reject high or critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  typecheck:
    name: TYPECHECK
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript type check
        run: npm run typecheck

  lint:
    name: LINT
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  test-unit:
    name: UNIT
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test -- --passWithNoTests
        env:
          CI: true

  test-component:
    name: COMPONENT
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run component tests
        run: npm run test:component -- --passWithNoTests
        env:
          CI: true

  test-security:
    name: SECURITY
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Start Supabase and export runtime credentials
        run: |
          supabase start
          supabase status -o env | sed 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/' | sed 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/' | sed 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' | sed 's/="\(.*\)"$/=\1/' >> "$GITHUB_ENV"
      - name: Apply migrations from a clean database
        run: supabase db reset --no-seed
      - name: Prove logical application-data recovery
        run: bash scripts/recovery-drill.sh
      - name: Run security regression tests
        run: npm run test:security
        env:
          CI: true
      - name: Generate canonical Supabase database types
        run: supabase gen types typescript --local > generated-database.types.ts
      - name: Upload generated database type snapshot
        uses: actions/upload-artifact@v6
        with:
          name: generated-database-types
          path: generated-database.types.ts
          retention-days: 7
          if-no-files-found: error
      - name: Reject schema/type drift
        run: diff -u src/infrastructure/supabase/database.types.ts generated-database.types.ts

  test-navigation:
    name: NAVIGATION
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run navigation and shell ownership tests
        run: npm run test:navigation
        env:
          CI: true

  build:
    name: BUILD
    runs-on: ubuntu-latest
    needs: [dependency-audit, typecheck, lint, test-unit, test-component, test-security, test-navigation]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-local-key
          SUPABASE_SERVICE_ROLE_KEY: build-only-local-service-key
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-output
          path: .next
          retention-days: 7

  test-e2e:
    name: E2E TRIAL
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Start fresh Supabase runtime
        run: |
          supabase start
          supabase status -o env | sed 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/' | sed 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/' | sed 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' | sed 's/="\(.*\)"$/=\1/' >> "$GITHUB_ENV"
      - name: Rebuild database from migrations
        run: supabase db reset --no-seed
      - name: Build against the exact trial runtime
        run: npm run build
        env:
          NODE_ENV: production
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run canonical two-member consumer journey
        run: npm run test:e2e:smoke
        env:
          CI: true
      - name: Upload E2E results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  accessibility:
    name: A11Y
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Start fresh Supabase runtime
        run: |
          supabase start
          supabase status -o env | sed 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/' | sed 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/' | sed 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' | sed 's/="\(.*\)"$/=\1/' >> "$GITHUB_ENV"
      - name: Rebuild database from migrations
        run: supabase db reset --no-seed
      - name: Build against the exact accessibility runtime
        run: npm run build
        env:
          NODE_ENV: production
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run accessibility smoke audit
        run: npm run test:a11y
        env:
          CI: true
      - name: Upload accessibility report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: accessibility-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  quality-gate:
    name: QUALITY GATE
    runs-on: ubuntu-latest
    needs: [dependency-audit, typecheck, lint, test-unit, test-component, test-security, test-navigation, build, test-e2e, accessibility]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          test "${{ needs.dependency-audit.result }}" = "success" || { echo "Production dependency audit failed"; exit 1; }
          test "${{ needs.typecheck.result }}" = "success" || { echo "Type check failed"; exit 1; }
          test "${{ needs.lint.result }}" = "success" || { echo "Lint failed"; exit 1; }
          test "${{ needs.test-unit.result }}" = "success" || { echo "Unit tests failed"; exit 1; }
          test "${{ needs.test-component.result }}" = "success" || { echo "Component tests failed"; exit 1; }
          test "${{ needs.test-security.result }}" = "success" || { echo "Security tests failed"; exit 1; }
          test "${{ needs.test-navigation.result }}" = "success" || { echo "Navigation tests failed"; exit 1; }
          test "${{ needs.build.result }}" = "success" || { echo "Build failed"; exit 1; }
          test "${{ needs.test-e2e.result }}" = "success" || { echo "E2E trial failed"; exit 1; }
          test "${{ needs.accessibility.result }}" = "success" || { echo "Accessibility smoke failed"; exit 1; }
          echo "All quality gates passed."
      - name: Quality Gate Summary
        if: success()
        run: |
          echo "Dependency audit: ${{ needs.dependency-audit.result }}"
          echo "Type check: ${{ needs.typecheck.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Unit tests: ${{ needs.test-unit.result }}"
          echo "Component tests: ${{ needs.test-component.result }}"
          echo "Security tests: ${{ needs.test-security.result }}"
          echo "Navigation tests: ${{ needs.test-navigation.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "E2E trial: ${{ needs.test-e2e.result }}"
          echo "Accessibility: ${{ needs.accessibility.result }}"
