name: One-shot canonical Supabase type sync

on:
  push:
    branches:
      - audit/consumer-trial-readiness-20260919

permissions:
  contents: write

jobs:
  sync-types:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: audit/consumer-trial-readiness-20260919
          fetch-depth: 0

      - name: Apply verified generated-contract delta
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/infrastructure/supabase/database.types.ts')
          text = path.read_text()
          old = 'DatabaseWithoutInternals[DefaultSchemaTableNameOrOptions["schema"]]["CompositeTypes"]'
          new = 'DatabaseWithoutInternals[PublicCompositeTypeNameOrOptions["schema"]]["CompositeTypes"]'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one verified generated-type mismatch, found {count}')
          path.write_text(text.replace(old, new).rstrip('\n') + '\n')
          PY

      - name: Commit verified canonical contract delta
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/supabase/database.types.ts
          git commit -m "chore: sync canonical Supabase database types"
          git push origin HEAD:audit/consumer-trial-readiness-20260919
