name: Refresh dependency lock

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  refresh-lock:
    name: REFRESH LOCKFILE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply available dependency security fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
        continue-on-error: true
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          retention-days: 1
