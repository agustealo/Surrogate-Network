name: Refresh dependency lock

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: write

jobs:
  refresh-lock:
    name: REFRESH LOCKFILE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply available dependency security fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify regenerated production dependency graph
        run: npm audit --omit=dev --audit-level=high
      - name: Commit regenerated lockfile to PR branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already canonical."
            exit 0
          fi
          git commit -m "security: regenerate audited dependency lock"
          git push origin HEAD:"$BRANCH"
